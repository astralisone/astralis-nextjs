app = "astralis-n8n"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5678
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "n8n_data"
  destination = "/home/node/.n8n"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
  cpus = 1
