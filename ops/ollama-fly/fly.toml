# fly.toml app configuration file generated for astralis-ollama-gpu on 2025-12-16T15:00:40-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'astralis-ollama-gpu'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'ollama_data'
  destination = '/root/.ollama'

[http_service]
  internal_port = 11434
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096
